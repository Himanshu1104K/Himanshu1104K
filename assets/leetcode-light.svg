<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" fill="none">
<style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#131316}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;fill:#5F606A}
.muted{fill:#5F606A} .faint{fill:#A2A3AB} .acc{fill:#4D7C0F}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.flow{stroke-dasharray:3 7;animation:flow 1.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="880" height="230" rx="18"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E6E6DF"/></pattern>

</defs>
<rect x=".5" y=".5" width="879" height="229" rx="18" fill="#FBFBF8" stroke="#E3E3DC"/>
<text x="40" y="46" class="mono" text-anchor="start">LEETCODE</text>
<text x="840" y="46" class="mono" text-anchor="end">SYNCED DAILY</text>
<text x="38" y="136" font-size="76" font-weight="700" letter-spacing="-3" class="up">577</text>
<text x="40" y="166" font-size="14" class="muted up" style="animation-delay:0.07s">problems solved of 4,095</text>
<text x="40" y="190" font-size="13" class="faint up" style="animation-delay:0.14s">Global rank #159,340</text>
<rect x="340" y="88" width="500" height="10" rx="5" fill="#F2F2EC"/>
<rect x="340.0" y="88" width="285.6" height="10" rx="5" fill="#16A34A" class="grow" style="animation-delay:0.14s"/>
<g class="up" style="animation-delay:0.21s">
  <circle cx="344" cy="137" r="4" fill="#16A34A"/>
  <text x="356" y="141" font-size="13" class="muted">Easy</text>
  <text x="340" y="176" font-size="28" font-weight="650" letter-spacing="-1">335<tspan font-size="13" font-weight="400" class="faint" dx="4">/ 974</tspan></text>
  <text x="340" y="198" font-size="12" class="faint">34% of all easy</text>
</g>
<rect x="629.6" y="88" width="194.4" height="10" rx="5" fill="#D97706" class="grow" style="animation-delay:0.21s"/>
<g class="up" style="animation-delay:0.28s">
  <circle cx="524" cy="137" r="4" fill="#D97706"/>
  <text x="536" y="141" font-size="13" class="muted">Medium</text>
  <text x="520" y="176" font-size="28" font-weight="650" letter-spacing="-1">228<tspan font-size="13" font-weight="400" class="faint" dx="4">/ 2,135</tspan></text>
  <text x="520" y="198" font-size="12" class="faint">11% of all medium</text>
</g>
<rect x="828.1" y="88" width="11.9" height="10" rx="5" fill="#DC2626" class="grow" style="animation-delay:0.28s"/>
<g class="up" style="animation-delay:0.35s">
  <circle cx="704" cy="137" r="4" fill="#DC2626"/>
  <text x="716" y="141" font-size="13" class="muted">Hard</text>
  <text x="700" y="176" font-size="28" font-weight="650" letter-spacing="-1">14<tspan font-size="13" font-weight="400" class="faint" dx="4">/ 986</tspan></text>
  <text x="700" y="198" font-size="12" class="faint">1% of all hard</text>
</g>
</svg>