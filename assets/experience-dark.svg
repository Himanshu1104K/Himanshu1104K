<svg xmlns="http://www.w3.org/2000/svg" width="880" height="960" viewBox="0 0 880 960" fill="none">
<style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EDEDF0}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;fill:#9B9CA6}
.muted{fill:#9B9CA6} .faint{fill:#5C5D67} .acc{fill:#C6F135}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.flow{stroke-dasharray:3 7;animation:flow 1.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="880" height="960" rx="18"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1E1F25"/></pattern>

</defs>
<rect x=".5" y=".5" width="879" height="959" rx="18" fill="#0E0F12" stroke="#25262D"/>
<text x="40" y="46" class="mono" text-anchor="start">EXPERIENCE</text>
<line x1="210" y1="82" x2="210" y2="914" stroke="#25262D" stroke-width="1.5"/>
<g class="up" style="animation-delay:0.00s"><text x="40" y="88" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" class="acc">APR 2025 — NOW</text><circle cx="210" cy="83" r="5" fill="#C6F135"/><text x="236" y="89" font-size="18" font-weight="650" letter-spacing="-.3">Bump.fm</text><text x="236" y="111" font-size="13" class="muted">Core backend engineer · Persist Ventures</text><rect x="236" y="132" width="6" height="2" fill="#5C5D67"/><text x="252" y="140" font-size="14" class="muted">Own 5+ Python and Go microservices behind the REST and GraphQL APIs: auth,</text><text x="252" y="161" font-size="14" class="muted">upload, playback, playlists, discovery and leaderboards.</text><rect x="236" y="180" width="6" height="2" fill="#5C5D67"/><text x="252" y="188" font-size="14" class="muted">Own the music-system layer: distribution, DSP data sharing, play logging,</text><text x="252" y="209" font-size="14" class="muted">impression calculation and analytics.</text><rect x="236" y="228" width="6" height="2" fill="#5C5D67"/><text x="252" y="236" font-size="14" class="muted">Solana token launches, AMM trading and claims, with Privy wallets and</text><text x="252" y="257" font-size="14" class="muted">MoonPay on-ramps.</text></g>
<g class="up" style="animation-delay:0.07s"><text x="40" y="314" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" class="faint">2025</text><circle cx="210" cy="309" r="4.5" fill="#0E0F12" stroke="#5C5D67" stroke-width="1.5"/><text x="236" y="315" font-size="18" font-weight="650" letter-spacing="-.3">Hey Ova</text><text x="236" y="337" font-size="13" class="muted">AI voice assistant · Persist Ventures</text><rect x="236" y="358" width="6" height="2" fill="#5C5D67"/><text x="252" y="366" font-size="14" class="muted">LangGraph workflow with intent routing, RAG on Qdrant and tool-calling</text><text x="252" y="387" font-size="14" class="muted">agents for Calendar, Gmail and search.</text><rect x="236" y="406" width="6" height="2" fill="#5C5D67"/><text x="252" y="414" font-size="14" class="muted">Three-store memory: Postgres for facts, Neo4j for relationships, Qdrant</text><text x="252" y="435" font-size="14" class="muted">for semantic recall.</text></g>
<g class="up" style="animation-delay:0.14s"><text x="40" y="492" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" class="faint">2025</text><circle cx="210" cy="487" r="4.5" fill="#0E0F12" stroke="#5C5D67" stroke-width="1.5"/><text x="236" y="493" font-size="18" font-weight="650" letter-spacing="-.3">MEND</text><text x="236" y="515" font-size="13" class="muted">Real-time conflict mediation · Persist Ventures</text><rect x="236" y="536" width="6" height="2" fill="#5C5D67"/><text x="252" y="544" font-size="14" class="muted">FastAPI REST and WebSocket backend with a 3-stage LangGraph pipeline and</text><text x="252" y="565" font-size="14" class="muted">live streaming.</text><rect x="236" y="584" width="6" height="2" fill="#5C5D67"/><text x="252" y="592" font-size="14" class="muted">Raised throughput 35% with async Redis pipelines.</text></g>
<g class="up" style="animation-delay:0.21s"><text x="40" y="649" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" class="acc">OCT 2025 — NOW</text><circle cx="210" cy="644" r="5" fill="#C6F135"/><text x="236" y="650" font-size="18" font-weight="650" letter-spacing="-.3">Freelance</text><text x="236" y="672" font-size="13" class="muted">Commerce and marketplace backends</text><rect x="236" y="693" width="6" height="2" fill="#5C5D67"/><text x="252" y="701" font-size="14" class="muted">Quick-commerce: PostGIS delivery matching and a RabbitMQ order queue at</text><text x="252" y="722" font-size="14" class="muted">1,000+ concurrent requests.</text><rect x="236" y="741" width="6" height="2" fill="#5C5D67"/><text x="252" y="749" font-size="14" class="muted">OOH ad marketplace: GiST exclusion constraints guarantee zero double-</text><text x="252" y="770" font-size="14" class="muted">bookings.</text><rect x="236" y="789" width="6" height="2" fill="#5C5D67"/><text x="252" y="797" font-size="14" class="muted">Dairy quick-commerce: FastAPI backend, in progress.</text></g>
<g class="up" style="animation-delay:0.28s"><text x="40" y="854" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" class="acc">AUG 2024 — NOW</text><circle cx="210" cy="849" r="5" fill="#C6F135"/><text x="236" y="855" font-size="18" font-weight="650" letter-spacing="-.3">GDG on Campus MIET</text><text x="236" y="877" font-size="13" class="muted">Organizer, previously Co-Lead</text><rect x="236" y="898" width="6" height="2" fill="#5C5D67"/><text x="252" y="906" font-size="14" class="muted">Lead a 20,000+ member developer community; ran 10+ workshops and</text><text x="252" y="927" font-size="14" class="muted">hackathons across AI, Cloud and Web.</text></g>
</svg>