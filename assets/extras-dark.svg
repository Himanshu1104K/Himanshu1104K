<svg xmlns="http://www.w3.org/2000/svg" width="880" height="206" viewBox="0 0 880 206" fill="none">
<style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EDEDF0}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;fill:#9B9CA6}
.muted{fill:#9B9CA6} .faint{fill:#5C5D67} .acc{fill:#C6F135}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.flow{stroke-dasharray:3 7;animation:flow 1.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="880" height="206" rx="18"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1E1F25"/></pattern>

</defs>
<rect x=".5" y=".5" width="879" height="205" rx="18" fill="#0E0F12" stroke="#25262D"/>
<text x="40" y="46" class="mono" text-anchor="start">EDUCATION</text>
<text x="40" y="88" font-size="18" font-weight="650" class="up">B.Tech, CSE (AI and ML)</text>
<text x="40" y="112" font-size="14" class="muted up">Meerut Institute of Engineering and Technology</text>
<text x="40" y="160" font-size="32" font-weight="700" letter-spacing="-1" class="up" style="animation-delay:0.07s">7.67<tspan font-size="13" font-weight="400" class="faint" dx="6">CGPA · 2022 — 2026</tspan></text>
<line x1="440" y1="40" x2="440" y2="176" stroke="#25262D"/>
<text x="472" y="46" class="mono" text-anchor="start">WINS</text>
<g class="up" style="animation-delay:0.07s"><text x="472" y="88" font-size="15" font-weight="600">GATE 2025</text><text x="600" y="88" font-size="14" class="muted">Qualified in Data Science and AI</text></g>
<g class="up" style="animation-delay:0.14s"><text x="472" y="124" font-size="15" font-weight="600">1st runner-up</text><text x="600" y="124" font-size="14" class="muted">Fetchathon 2.0</text></g>
<g class="up" style="animation-delay:0.21s"><text x="472" y="160" font-size="15" font-weight="600">3rd runner-up</text><text x="600" y="160" font-size="14" class="muted">Code-Genesis</text></g>
</svg>