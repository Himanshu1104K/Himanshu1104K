<svg xmlns="http://www.w3.org/2000/svg" width="880" height="308" viewBox="0 0 880 308" fill="none">
<style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EDEDF0}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;fill:#9B9CA6}
.muted{fill:#9B9CA6} .faint{fill:#5C5D67} .acc{fill:#C6F135}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.flow{stroke-dasharray:3 7;animation:flow 1.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="880" height="308" rx="18"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1E1F25"/></pattern>

</defs>
<rect x=".5" y=".5" width="879" height="307" rx="18" fill="#0E0F12" stroke="#25262D"/>
<text x="40" y="46" class="mono" text-anchor="start">BY THE NUMBERS</text>
<g class="up" style="animation-delay:0.00s">
  <text x="40.0" y="116" font-size="40" font-weight="700" letter-spacing="-1.5">1.5<tspan class="acc" font-size="24" dx="2">yrs</tspan></text>
  <text x="40.0" y="140" font-size="14" font-weight="500">Production experience</text>
  <text x="40.0" y="159" font-size="12" class="faint">Python and Go services</text>
</g>
<g class="up" style="animation-delay:0.07s">
  <text x="334.6666666666667" y="116" font-size="40" font-weight="700" letter-spacing="-1.5">5<tspan class="acc" font-size="24" dx="2">+</tspan></text>
  <text x="334.6666666666667" y="140" font-size="14" font-weight="500">Microservices owned</text>
  <text x="334.6666666666667" y="159" font-size="12" class="faint">at Bump.fm</text>
</g>
<g class="up" style="animation-delay:0.14s">
  <text x="601.3333333333334" y="116" font-size="40" font-weight="700" letter-spacing="-1.5">577<tspan class="acc" font-size="24" dx="2"></tspan></text>
  <text x="601.3333333333334" y="140" font-size="14" font-weight="500">LeetCode problems</text>
  <text x="601.3333333333334" y="159" font-size="12" class="faint">solved in Java</text>
</g>
<g class="up" style="animation-delay:0.21s">
  <text x="40.0" y="228" font-size="40" font-weight="700" letter-spacing="-1.5">20k<tspan class="acc" font-size="24" dx="2">+</tspan></text>
  <text x="40.0" y="252" font-size="14" font-weight="500">Developer community</text>
  <text x="40.0" y="271" font-size="12" class="faint">GDG on Campus MIET</text>
</g>
<g class="up" style="animation-delay:0.28s">
  <text x="334.6666666666667" y="228" font-size="40" font-weight="700" letter-spacing="-1.5">35<tspan class="acc" font-size="24" dx="2">%</tspan></text>
  <text x="334.6666666666667" y="252" font-size="14" font-weight="500">Throughput gain</text>
  <text x="334.6666666666667" y="271" font-size="12" class="faint">with async Redis pipelines</text>
</g>
<g class="up" style="animation-delay:0.35s">
  <text x="601.3333333333334" y="228" font-size="40" font-weight="700" letter-spacing="-1.5">1k<tspan class="acc" font-size="24" dx="2">+</tspan></text>
  <text x="601.3333333333334" y="252" font-size="14" font-weight="500">Concurrent requests</text>
  <text x="601.3333333333334" y="271" font-size="12" class="faint">quick-commerce backend</text>
</g>
<line x1="306.6666666666667" y1="78" x2="306.6666666666667" y2="294" stroke="#25262D"/>
<line x1="573.3333333333334" y1="78" x2="573.3333333333334" y2="294" stroke="#25262D"/>
<line x1="40" y1="180" x2="840" y2="180" stroke="#25262D"/>
</svg>